arxiv:
  categories:
    - cs.AI
    - cs.LG
    - cs.CL
  max_results: 8
  query: ""

ollama:
  base_url: "http://localhost:11434"
  model: "qwen3:8b"
  temperature: 0.6
  max_tokens: 2000
  timeout_seconds: 120

output:
  save_dir: "./papers"
  log_level: "INFO"
  log_file: "./logs/arxiv_researcher.log"
